[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechdac"
version = "0.1.0"
description = "A small, unit-safe mechanical design calculation library"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "Pint>=0.24,<1",
    "PyYAML>=6.0,<7",
]

[project.scripts]
mechdac = "mechdac.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
plotting = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
