[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechdac"
version = "0.1.0"
description = "A small, unit-safe mechanical design calculation library"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "Pint>=0.24,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
